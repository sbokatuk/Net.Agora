name: release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The tag is the release train's label, not a version to stamp: the products sit on
  # independent native version lines (RTC 4.6.x, RTM 2.2.x) and each publishes at its own pin
  # from Directory.Build.props. Republishing a product whose pin did not move is a no-op — the
  # push below uses --skip-duplicate.
  build:
    name: build
    uses: ./.github/workflows/build.yml

  publish:
    name: publish to nuget.org and create release
    needs: [build]
    runs-on: ubuntu-latest
    # Must match the Environment on the nuget.org trusted publishing policy for this workflow.
    # The policy carries the environment name in the OIDC claim it validates, so a mismatch fails
    # the token exchange with HTTP 401 and "Environment mismatch for policy ...".
    environment: nuget.org
    permissions:
      # contents: write creates the GitHub release; id-token: write lets the job request the OIDC
      # token that nuget.org exchanges for a short-lived API key.
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed to find the previous tag when generating the changelog.
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts

      # nuget.org is published to first: a GitHub release that links to packages which failed to
      # upload would be worse than a release created a moment late.
      - name: Authenticate to nuget.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate

      - name: Compose release notes
        run: |
          . ./build/pins.sh
          previous=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)

          # Tags are the train label, e.g. v4.6.2.2 for an RTC-led train.
          notes="docs/release-notes/${GITHUB_REF_NAME#v}.md"

          {
            if [ -f "${notes}" ]; then
              echo "==> using curated notes from ${notes}" >&2
              cat "${notes}"
            else
              echo "## What's changed"
              echo
              if [ -n "${previous}" ]; then
                git log --no-merges --pretty='- %s (%h)' "${previous}..${GITHUB_REF_NAME}"
              else
                echo "Initial release."
              fi
            fi
            echo
            if [ -n "${previous}" ]; then
              echo "**Full changelog**: ${{ github.server_url }}/${{ github.repository }}/compare/${previous}...${GITHUB_REF_NAME}"
              echo
            fi

            echo "## Packages"
            echo
            echo "Pure façades over the platform packages — Video:"
            echo "Net.Agora.Video.Android \`${NET_AGORA_VIDEO_ANDROID_VERSION}\` /"
            echo "Net.Agora.Video.iOS \`${NET_AGORA_VIDEO_IOS_VERSION}\`; Voice:"
            echo "Net.Agora.Voice.Android \`${NET_AGORA_VOICE_ANDROID_VERSION}\` /"
            echo "Net.Agora.Voice.iOS \`${NET_AGORA_VOICE_IOS_VERSION}\`"
            echo "([sbokatuk/Net.Agora.Android](https://github.com/sbokatuk/Net.Agora.Android),"
            echo "[sbokatuk/Net.Agora.iOS](https://github.com/sbokatuk/Net.Agora.iOS)) — this"
            echo "repository binds nothing itself. Targeting .NET 8, .NET 9 and .NET 10. No Mac"
            echo "Catalyst — see docs/BUILD.md."
            echo
            echo "| Package | Platforms | NuGet |"
            echo "| --- | --- | --- |"
            echo "| \`Net.Agora.Video.Maui\` | Android, iOS | [${AGORA_VIDEO_PACKAGE_VERSION}](https://www.nuget.org/packages/Net.Agora.Video.Maui/${AGORA_VIDEO_PACKAGE_VERSION}) |"
            echo "| \`Net.Agora.Video\` | Android, iOS | [${AGORA_VIDEO_PACKAGE_VERSION}](https://www.nuget.org/packages/Net.Agora.Video/${AGORA_VIDEO_PACKAGE_VERSION}) |"
            echo "| \`Net.Agora.Voice.Maui\` | Android, iOS | [${AGORA_VOICE_PACKAGE_VERSION}](https://www.nuget.org/packages/Net.Agora.Voice.Maui/${AGORA_VOICE_PACKAGE_VERSION}) |"
            echo "| \`Net.Agora.Voice\` | Android, iOS | [${AGORA_VOICE_PACKAGE_VERSION}](https://www.nuget.org/packages/Net.Agora.Voice/${AGORA_VOICE_PACKAGE_VERSION}) |"
            echo "| \`Net.Agora.Signaling\` | Android, iOS | [${AGORA_SIGNALING_PACKAGE_VERSION}](https://www.nuget.org/packages/Net.Agora.Signaling/${AGORA_SIGNALING_PACKAGE_VERSION}) |"
            echo "| \`Net.Agora.Chat.Maui\` | Android, iOS | [${AGORA_CHAT_PACKAGE_VERSION}](https://www.nuget.org/packages/Net.Agora.Chat.Maui/${AGORA_CHAT_PACKAGE_VERSION}) |"
            echo "| \`Net.Agora.Chat\` | Android, iOS | [${AGORA_CHAT_PACKAGE_VERSION}](https://www.nuget.org/packages/Net.Agora.Chat/${AGORA_CHAT_PACKAGE_VERSION}) |"
            echo "| \`Net.Agora.Whiteboard.Maui\` | Android, iOS | [${AGORA_WHITEBOARD_PACKAGE_VERSION}](https://www.nuget.org/packages/Net.Agora.Whiteboard.Maui/${AGORA_WHITEBOARD_PACKAGE_VERSION}) |"
            echo "| \`Net.Agora.Whiteboard\` | Android, iOS | [${AGORA_WHITEBOARD_PACKAGE_VERSION}](https://www.nuget.org/packages/Net.Agora.Whiteboard/${AGORA_WHITEBOARD_PACKAGE_VERSION}) |"
            echo
            echo "\`\`\`"
            echo "dotnet add package Net.Agora.Video.Maui --version ${AGORA_VIDEO_PACKAGE_VERSION}       # MAUI video apps"
            echo "dotnet add package Net.Agora.Video --version ${AGORA_VIDEO_PACKAGE_VERSION}            # video, everything else"
            echo "dotnet add package Net.Agora.Voice.Maui --version ${AGORA_VOICE_PACKAGE_VERSION}       # MAUI voice-only apps"
            echo "dotnet add package Net.Agora.Voice --version ${AGORA_VOICE_PACKAGE_VERSION}            # voice-only, everything else"
            echo "dotnet add package Net.Agora.Signaling --version ${AGORA_SIGNALING_PACKAGE_VERSION}    # signaling / realtime messaging"
            echo "dotnet add package Net.Agora.Chat.Maui --version ${AGORA_CHAT_PACKAGE_VERSION}         # MAUI chat apps"
            echo "dotnet add package Net.Agora.Chat --version ${AGORA_CHAT_PACKAGE_VERSION}              # chat / IM, everything else"
            echo "dotnet add package Net.Agora.Whiteboard.Maui --version ${AGORA_WHITEBOARD_PACKAGE_VERSION}   # MAUI whiteboard apps"
            echo "dotnet add package Net.Agora.Whiteboard --version ${AGORA_WHITEBOARD_PACKAGE_VERSION}        # whiteboard, everything else"
            echo "\`\`\`"
          } > release-notes.md

          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The packages themselves are not attached: nuget.org is the distribution channel, and
          # the iOS package carries several xcframeworks per target framework. The notes link to
          # every published package instead.
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md
