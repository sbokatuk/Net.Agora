name: pull request

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    name: resolve beta suffix
    runs-on: ubuntu-latest
    outputs:
      suffix: ${{ steps.resolve.outputs.suffix }}
    steps:
      - id: resolve
        run: |
          # The PR number and run number make each published prerelease unique, since nuget.org
          # never allows a version to be reused. Each product packs at its own base version from
          # Directory.Build.props — see build/BuildNugets.sh.
          suffix="beta.${{ github.event.number }}.${{ github.run_number }}"
          echo "suffix=${suffix}" >> "$GITHUB_OUTPUT"
          echo "Building every product at its own version with suffix -${suffix}" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      suffix: ${{ needs.version.outputs.suffix }}

  publish:
    name: publish beta to nuget.org
    needs: [version, build]
    runs-on: ubuntu-latest
    # Forked pull requests get no OIDC token for this repository, so the exchange would fail with
    # a confusing error. Those PRs still build and test; only the publish step is skipped.
    if: github.event.pull_request.head.repo.full_name == github.repository
    # Must match the Environment on the nuget.org trusted publishing policy for this workflow.
    # Trusted publishing policies are per workflow file, so this job needs its own policy on
    # nuget.org pointing at pr.yml — the release.yml policy will not match it.
    environment: nuget.org
    permissions:
      contents: read
      # Lets the job request the OIDC token that nuget.org exchanges for a short-lived API key.
      id-token: write
    steps:
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts

      # Deliberately immediately before the push: the issued key is valid for one hour, and each
      # OIDC token can be exchanged exactly once.
      - name: Authenticate to nuget.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate

      - uses: actions/checkout@v4

      - name: Summarise
        run: |
          . ./build/pins.sh
          s="${{ needs.version.outputs.suffix }}"
          {
            echo "### Published beta packages to nuget.org"
            echo
            for id in Net.Agora.Video.Maui Net.Agora.Video Net.Agora.Voice.Maui Net.Agora.Voice; do
              echo "- [${id}](https://www.nuget.org/packages/${id}/${AGORA_VIDEO_PACKAGE_VERSION}-${s})"
            done
            echo "- [Net.Agora.Signaling](https://www.nuget.org/packages/Net.Agora.Signaling/${AGORA_SIGNALING_PACKAGE_VERSION}-${s})"
            for id in Net.Agora.Chat.Maui Net.Agora.Chat; do
              echo "- [${id}](https://www.nuget.org/packages/${id}/${AGORA_CHAT_PACKAGE_VERSION}-${s})"
            done
            for id in Net.Agora.Whiteboard.Maui Net.Agora.Whiteboard; do
              echo "- [${id}](https://www.nuget.org/packages/${id}/${AGORA_WHITEBOARD_PACKAGE_VERSION}-${s})"
            done
            for id in Net.Agora.Fastboard.Maui Net.Agora.Fastboard; do
              echo "- [${id}](https://www.nuget.org/packages/${id}/${AGORA_FASTBOARD_PACKAGE_VERSION}-${s})"
            done
          } >> "$GITHUB_STEP_SUMMARY"
