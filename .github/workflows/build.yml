name: build

# Reusable pipeline: packs the façade packages at a given version, validates them, runs the unit
# tests and the device checks on both an iOS simulator and an Android emulator, and builds each
# sample against the packed packages. The pack job only packs (and uploads the artifact) so its
# dependents can start as soon as the packages exist; the sample build/link checks run as their own
# per-product, per-platform matrix rather than a serial tail of pack. Callers (pr.yml, release.yml)
# decide the version and what to do with the result.
#
# This repository builds no raw platform binding anymore: Net.Agora.Video.Android and
# Net.Agora.Video.iOS are published from sbokatuk/Net.Agora.Android and sbokatuk/Net.Agora.iOS, and
# restored here from nuget.org at the exact versions pinned in Directory.Build.props. One macOS
# runner is enough for the pack job — Net.Agora.Video targets both platforms' TFMs, so restoring it
# needs the iOS workload even though nothing here compiles Objective-C.

on:
  workflow_call:
    inputs:
      suffix:
        description: >
          Optional prerelease suffix (e.g. beta.12.34) appended to every product's own version.
          The products sit on independent native version lines (RTC 4.6.x, RTM 2.2.x), so there
          is no single version to stamp — each packs at its own pin from Directory.Build.props.
        required: false
        default: ''
        type: string
      track:
        description: >
          Restrict the build to one release track — rtc, signaling, chat, whiteboard or fastboard
          (see build/tracks.tsv). Packs only that track's products and skips the CI-only jobs
          (unit-tests, validate, e2e), which the pull request that merged this commit already ran.
          Empty, the default, builds and validates the whole repository — what push and
          pull_request want. Releases set it, so a per-track tag publishes only its own track.
        required: false
        default: ''
        type: string
      e2e-ios-target-frameworks:
        description: >
          Which of the packages' target frameworks the simulator checks run against, as a JSON
          array. Defaults to the two extremes: net8, the oldest asset set and the one nothing else
          exercises, and net10, whose assets are produced by the merge step in BuildNugets.sh and so
          are the only ones that could be grafted in wrong. net9 sits between them and comes out of
          the same pack pass as net8, so testing it too would buy little for the runner minutes.
        required: false
        default: '["net8.0-ios18.0", "net10.0-ios26.0"]'
        type: string
      e2e-android-target-frameworks:
        description: Same, for the emulator checks.
        required: false
        default: '["net8.0-android34.0", "net10.0-android36.0"]'
        type: string
      e2e-api-level:
        description: Android API level the emulator boots.
        required: false
        default: 35
        type: number

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  unit-tests:
    name: unit tests
    # No dependency on pack: Net.Agora.UnitTests links the platform-neutral façade source directly
    # (see its own csproj) rather than referencing a packed package, so it needs neither ./artifacts
    # nor a mobile workload — this is the fastest failure signal in the whole pipeline.
    # Off on a scoped track release: the tagged commit already ran it on its PR.
    if: ${{ inputs.track == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Run unit tests
        run: dotnet test tests/Net.Agora.UnitTests --logger 'trx;LogFileName=unit-tests.trx'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: '**/*.trx'
          if-no-files-found: ignore
          retention-days: 7

  pack:
    name: pack
    # Pinned rather than macos-latest so an image roll cannot change which Xcode versions are
    # available to select-xcode.sh.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: ./.github/scripts/select-xcode.sh

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Install iOS, macOS, Android and MAUI workloads for every SDK band
        run: |
          # macos is here for the native macOS (AppKit) leg of the Video/Voice/Signaling façades —
          # a distinct platform from maui-ios (which is Mac Catalyst-only, and Agora ships no
          # Catalyst slice). See src/Net.Agora.Video/Net.Agora.Video.csproj's macos ItemGroup.
          for major in 9 10; do
            dir="${RUNNER_TEMP}/sdk${major}"
            mkdir -p "${dir}"
            sdk=$(dotnet --list-sdks | grep "^${major}\." | tail -1 | cut -d' ' -f1)
            ( cd "${dir}" \
              && dotnet new globaljson --sdk-version "${sdk}" --force \
              && dotnet workload install ios macos android maui-android maui-ios )
          done

      - name: Set up Android SDK platforms
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 platforms;android-35 platforms;android-36'

      - name: Pack
        run: |
          suffix=""
          [ -n "${{ inputs.suffix }}" ] && suffix="--suffix ${{ inputs.suffix }}"
          if [ -n "${{ inputs.track }}" ]; then
            # One track's products, from one call — see build/tracks.tsv.
            ./build/BuildNugets.sh --track "${{ inputs.track }}" $suffix
          else
            for product in video voice signaling chat whiteboard fastboard; do
              ./build/BuildNugets.sh "$product" $suffix
            done
          fi

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
          retention-days: 7

  build-samples:
    name: sample build (${{ matrix.product }}, ${{ matrix.platform }})
    needs: pack
    # Off on a scoped track release: a CI-only build/link check, and the scoped pack packed only the
    # tagged track's products - the other samples could not restore at this tag. The merged commit
    # already ran this on its pull request.
    if: ${{ inputs.track == '' }}
    # Android needs no Apple toolchain, so its leg runs on Linux (faster and cheaper); iOS must have
    # Xcode. Chosen per matrix leg — see the include block below.
    runs-on: ${{ matrix.os }}
    strategy:
      # fail-fast off: one product or platform failing to link should not cancel the others. The
      # whole point of the check is to see which façades are consumable, so a partial result is a
      # result - "Fastboard/ios only" and "every product" point at very different causes.
      fail-fast: false
      matrix:
        # One leg per product per platform. Each proves its façade is consumable: it restores (the
        # platform packages coming from nuget.org at the pinned versions), resolves to the right
        # platform binding for the target framework, and links under the Release toolchain (R8 on
        # Android, AOT on iOS) - where a binding that restores fine in Debug can still fail to link.
        # This was one serial step at the tail of the pack job; the six iOS Release AOT builds run
        # ~25 min each, so back to back they dominated the whole pipeline. Split out, they run
        # concurrently, and pack's dependents (validate, e2e) no longer wait on them.
        product: [Video, Voice, Signaling, Chat, Whiteboard, Fastboard]
        platform: [android, ios, macos]
        exclude:
          # No native macOS SDK for these products, so no macos façade leg and no .Mac sample —
          # see src/Net.Agora.<P>/…: Chat/Whiteboard/Fastboard are Android+iOS only.
          - { product: Chat, platform: macos }
          - { product: Whiteboard, platform: macos }
          - { product: Fastboard, platform: macos }
        include:
          # os/tfm/build-args attach to every combination whose platform matches (GitHub merges an
          # include entry into the matrix legs that already share its keys). The target frameworks
          # are the bands the pack job's original loop exercised.
          - platform: android
            os: ubuntu-latest
            tfm: net9.0-android35.0
          - platform: ios
            os: macos-15
            tfm: net9.0-ios18.0
            # Pinned to a simulator runtime identifier. These samples are built, never launched, so
            # Release's startup-time AOT concerns do not apply.
            build-args: -p:RuntimeIdentifier=iossimulator-arm64
          - platform: macos
            os: macos-15
            # The native macOS (AppKit) leg — Video/Voice/Signaling only. These build the
            # Net.Agora.Sample.<Product>.Mac AppKit samples, which consume the cross-platform façade
            # over its net-macos leg (no MAUI: MAUI's only desktop-Mac target is Mac Catalyst, which
            # Agora ships no slice for). Pinned platform version, no RuntimeIdentifier.
            tfm: net9.0-macos15.0
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        if: ${{ matrix.platform == 'ios' || matrix.platform == 'macos' }}
        run: ./.github/scripts/select-xcode.sh

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # The samples build at net9 on both platforms, so the .NET 9 band is enough - no net10
          # scratch global.json as the pack/e2e jobs need.
          dotnet-version: 9.0.x

      - name: Install workloads
        # The samples are MAUI apps, so the maui-<platform> workload is required on top of the raw
        # platform one - this is what makes the check exercise the .Maui packages the device tests
        # deliberately skip.
        #
        # The samples multi-target BOTH platforms' target frameworks, and `dotnet build -f` still
        # restores every one of them - so restore needs every platform's workload installed, not
        # just the one being built (NETSDK1147 otherwise). On macOS that means all four. On Linux
        # the iOS workload does not exist at all (NETSDK1178, "build the project on another
        # operating system"), which no workload install can fix - the sample csprojs instead drop
        # the iOS target frameworks from TargetFrameworks when restoring on Linux.
        run: |
          case "${{ matrix.platform }}" in
            ios)   dotnet workload install ios android maui-ios maui-android ;;
            # The macOS AppKit sample is macos-only (no MAUI head), so only the macos workload is
            # needed — the cross-platform façade it references resolves to its .Mac binding for the
            # net-macos target framework.
            macos) dotnet workload install macos ;;
            *)     dotnet workload install android maui-android ;;
          esac

      - name: Set up the Android SDK
        if: ${{ matrix.platform == 'android' }}
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35'

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts

      - name: Build the ${{ matrix.product }} sample
        run: |
          . ./build/pins.sh
          # product -> its sample project and its own version (products sit on independent native
          # version lines, so each carries its own version property). Mirrors the e2e jobs' case.
          case "${{ matrix.product }}" in
            Video)      project=Net.Agora.Sample;            base="${AGORA_VIDEO_PACKAGE_VERSION}";      prop=AgoraVideoPackageVersion ;;
            Voice)      project=Net.Agora.Sample.Voice;      base="${AGORA_VOICE_PACKAGE_VERSION}";      prop=AgoraVoicePackageVersion ;;
            Signaling)  project=Net.Agora.Sample.Signaling;  base="${AGORA_SIGNALING_PACKAGE_VERSION}";  prop=AgoraSignalingPackageVersion ;;
            Chat)       project=Net.Agora.Sample.Chat;       base="${AGORA_CHAT_PACKAGE_VERSION}";       prop=AgoraChatPackageVersion ;;
            Whiteboard) project=Net.Agora.Sample.Whiteboard; base="${AGORA_WHITEBOARD_PACKAGE_VERSION}"; prop=AgoraWhiteboardPackageVersion ;;
            Fastboard)  project=Net.Agora.Sample.Fastboard;  base="${AGORA_FASTBOARD_PACKAGE_VERSION}";  prop=AgoraFastboardPackageVersion ;;
          esac
          # The macOS leg builds the AppKit sample (Net.Agora.Sample.<Product>.Mac), which consumes
          # the cross-platform façade rather than its .Maui companion. Only Video/Voice/Signaling
          # reach this leg (the matrix excludes the rest), so the name always resolves.
          if [ "${{ matrix.platform }}" = "macos" ]; then
            project="Net.Agora.Sample.${{ matrix.product }}.Mac"
          fi
          version="${base}${{ inputs.suffix != '' && format('-{0}', inputs.suffix) || '' }}"
          dotnet build "samples/${project}" \
            -c Release -f "${{ matrix.tfm }}" ${{ matrix.build-args }} \
            -p:"${prop}=${version}"

  validate:
    name: validate packages
    needs: pack
    # Skipped on a scoped track release: the package tests assert the whole product set, which a
    # single-track pack does not produce — and the merged commit already ran them on its PR.
    if: ${{ inputs.track == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts

      - name: Run package tests
        run: dotnet test tests/Net.Agora.PackageTests --logger 'trx;LogFileName=package-tests.trx'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-test-results
          path: '**/*.trx'
          if-no-files-found: ignore
          retention-days: 7

  e2e-ios:
    name: simulator checks (${{ matrix.product }}, ${{ matrix.target-framework }})
    timeout-minutes: 45
    needs: pack
    # Off on a scoped track release — the tagged commit was device-tested on its PR.
    if: ${{ inputs.track == '' }}
    runs-on: macos-15
    strategy:
      # fail-fast off: when one target framework breaks it is worth knowing whether the other did
      # too, since "net8 only" and "both" point at very different causes.
      fail-fast: false
      matrix:
        # One leg per product: the Video and Voice façades' platform packages carry the same
        # native artifacts, so a single device test app holds exactly one of them — and Signaling
        # is a different product entirely.
        product: [Video, Voice, Signaling, Chat, Whiteboard, Fastboard]
        target-framework: ${{ fromJSON(inputs.e2e-ios-target-frameworks) }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: ./.github/scripts/select-xcode.sh

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Install the iOS workload
        run: |
          # The device app is built for the target framework under test, so install the workload
          # for the band that owns it. global.json pins .NET 9; the app may need .NET 10.
          mkdir -p "${RUNNER_TEMP}/sdk10"
          ( cd "${RUNNER_TEMP}/sdk10" \
            && dotnet new globaljson --sdk-version "$(dotnet --list-sdks | grep '^10\.' | tail -1 | cut -d' ' -f1)" --force \
            && dotnet workload install ios )
          dotnet workload install ios

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts

      - name: Run checks on simulator
        run: |
          . ./build/pins.sh
          case "${{ matrix.product }}" in
            Video) base="${AGORA_VIDEO_PACKAGE_VERSION}" ;;
            Voice) base="${AGORA_VOICE_PACKAGE_VERSION}" ;;
            Signaling) base="${AGORA_SIGNALING_PACKAGE_VERSION}" ;;
            Chat)      base="${AGORA_CHAT_PACKAGE_VERSION}" ;;
            Whiteboard) base="${AGORA_WHITEBOARD_PACKAGE_VERSION}" ;;
            Fastboard) base="${AGORA_FASTBOARD_PACKAGE_VERSION}" ;;
          esac
          version="${base}${{ inputs.suffix != '' && format('-{0}', inputs.suffix) || '' }}"
          ./.github/scripts/run-simulator-tests.sh "${version}" "${{ matrix.target-framework }}" "${{ matrix.product }}"

      - name: Upload simulator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-test-logs-${{ matrix.product }}-${{ matrix.target-framework }}
          path: simulator-tests.log
          if-no-files-found: ignore
          retention-days: 7

  e2e-android:
    name: emulator checks (${{ matrix.product }}, ${{ matrix.target-framework }})
    timeout-minutes: 60
    needs: pack
    # Off on a scoped track release — the tagged commit was device-tested on its PR.
    if: ${{ inputs.track == '' }}
    strategy:
      fail-fast: false
      matrix:
        # One leg per product — see the iOS job's matrix comment.
        product: [Video, Voice, Signaling, Chat, Whiteboard, Fastboard]
        target-framework: ${{ fromJSON(inputs.e2e-android-target-frameworks) }}
    # Linux, unlike the pack job: the emulator needs KVM, which the macOS runners do not have, and
    # the Android head of the device app needs no Apple toolchain to build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # 8.0.x is here for the net8 matrix leg only - see the workload step below.
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Install the Android workload for every SDK band
        run: |
          # One band per Android API level, because that is what owns the runtime packs: API 34 is
          # the .NET 8 workload, 35 the .NET 9 one, 36 the .NET 10 one. Installing only the band
          # global.json pins lets a net8 app compile and then fail at packaging with NETSDK1112.
          # See the comment in run-emulator-tests.sh.
          for major in 8 10; do
            dir="${RUNNER_TEMP}/sdk${major}"
            mkdir -p "${dir}"
            ( cd "${dir}" \
              && dotnet new globaljson --sdk-version "$(dotnet --list-sdks | grep "^${major}\." | tail -1 | cut -d' ' -f1)" --force \
              && dotnet workload install android )
          done
          dotnet workload install android

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 platforms;android-35 platforms;android-36'

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts

      - name: Enable KVM
        # The x86_64 emulator is unusably slow without hardware acceleration, and the runner image
        # does not grant access to /dev/kvm by default.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Free disk space
        # The API-35 emulator refuses to start without ~7.2 GB free for its userdata partition
        # ("FATAL | Not enough space to create userdata partition"), and after the SDKs, workloads
        # and Android platforms above, the runner image sits right at that line - whether a run
        # passes depends on how much the preinstalled image happened to grow that week. Deleting
        # toolchains this job never touches buys ~10 GB of headroom.
        run: |
          df -h /
          sudo rm -rf /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /

      - name: Resolve this leg's product version
        # In its own step rather than inside the emulator action's script: the action runs its
        # script with /usr/bin/sh, and pins.sh is bash (set -o pipefail). run: steps default to
        # bash, and the resolved version crosses over through GITHUB_ENV.
        run: |
          . ./build/pins.sh
          case "${{ matrix.product }}" in
            Video) base="${AGORA_VIDEO_PACKAGE_VERSION}" ;;
            Voice) base="${AGORA_VOICE_PACKAGE_VERSION}" ;;
            Signaling) base="${AGORA_SIGNALING_PACKAGE_VERSION}" ;;
            Chat)      base="${AGORA_CHAT_PACKAGE_VERSION}" ;;
            Whiteboard) base="${AGORA_WHITEBOARD_PACKAGE_VERSION}" ;;
            Fastboard) base="${AGORA_FASTBOARD_PACKAGE_VERSION}" ;;
          esac
          echo "AGORA_E2E_VERSION=${base}${{ inputs.suffix != '' && format('-{0}', inputs.suffix) || '' }}" >> "$GITHUB_ENV"

      - name: Run checks on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.e2e-api-level }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          disable-animations: true
          script: ./.github/scripts/run-emulator-tests.sh "$AGORA_E2E_VERSION" "${{ matrix.target-framework }}" "${{ matrix.product }}"

      - name: Upload emulator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test-logs-${{ matrix.product }}-${{ matrix.target-framework }}
          path: emulator-tests.log
          if-no-files-found: ignore
          retention-days: 7
